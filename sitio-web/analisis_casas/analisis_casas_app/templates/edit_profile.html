{% extends 'base.html' %}

{% block title %}Editar Perfil{% endblock %}

{% block content %}
<main class="main_edit">
    <div class="container">
        <h1>Editar Perfil</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

        </form>
    </div>
</main>

{% endblock %}
